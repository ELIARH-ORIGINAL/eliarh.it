.construction{background:#c0392b;color:#fff;text-align:center;padding:8px;font-family:Arial,sans-serif;font-size:13px;font-weight:bold;letter-spacing:.1em;}
main{max-width:860px;margin:0 auto;padding:3rem 2rem 5rem;}

h1{font-size:1.6rem;font-weight:bold;color:var(--text-dark);margin-bottom:.5rem;border-bottom:2px solid var(--gold);padding-bottom:.5rem;display:inline-block;}
.updated{font-size:.78rem;color:var(--text-muted);margin:1rem 0 2rem;}
h2{font-size:1rem;font-weight:bold;color:var(--text-dark);margin:2rem 0 .5rem;text-transform:uppercase;letter-spacing:.06em;}
p{font-size:.9rem;color:var(--text-mid);margin-bottom:1rem;line-height:1.8;}
ul{padding-left:1.5rem;margin-bottom:1rem;}
ul li{font-size:.9rem;color:var(--text-mid);line-height:1.8;margin-bottom:.3rem;}
.highlight-box{background:var(--card-bg);border:1px solid var(--card-border);border-left:4px solid var(--gold);border-radius:var(--radius);padding:1.2rem 1.5rem;margin:1.5rem 0;}
.highlight-box p{margin:0;font-size:.88rem;}
.back-link{display:inline-block;margin-bottom:2rem;font-size:.82rem;color:var(--gold-d);font-weight:bold;text-decoration:underline;}
footer{background:var(--menu-hover);color:rgba(247,243,238,0.65);text-align:center;padding:2rem;font-size:.78rem;line-height:1.8;}
footer strong{color:var(--menu-active);}
footer a{color:var(--menu-active);text-decoration:underline;font-size:.75rem;}
@media(max-width:768px){.nav-top{padding:0 1.2rem;}main{padding:2rem 1.2rem 4rem;}}

function setLang(lang){
  document.getElementById('html-root').lang=lang==='pt'?'pt-BR':lang;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent===lang.toUpperCase()));
  const d=T[lang];
  document.querySelectorAll('[data-t]').forEach(el=>{const k=el.getAttribute('data-t');if(d[k]!==undefined)el.innerHTML=d[k];});
}
