<!DOCTYPE html>
<html lang="it" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELIARH.IT — Scuola Globale di Eccellenza</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --menu-bg:#4a5568;--menu-hover:#2d3748;--menu-text:#f7f3ee;--menu-active:#C9A84C;
  --body-bg:#f5f0e8;--card-bg:#f0ead8;--card-border:#d6ccb4;
  --text-dark:#1a1a1a;--text-mid:#3a3a3a;--text-muted:#6a6a6a;
  --gold:#C9A84C;--gold-d:#9a7a30;--white:#ffffff;--radius:6px;--shadow:0 2px 12px rgba(0,0,0,0.10);
}
body{font-family:Arial,sans-serif;font-size:14px;background:var(--body-bg);color:var(--text-dark);line-height:1.7;}
a{text-decoration:none;color:inherit;}

/* NAV */
header{background:var(--menu-bg);position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
.nav-top{display:flex;align-items:center;justify-content:space-between;padding:0 3rem;height:64px;}
.nav-logo{font-size:1.3rem;font-weight:bold;color:var(--menu-active);letter-spacing:.08em;}
.nav-logo span{color:var(--menu-text);font-weight:normal;font-size:1rem;margin-left:.4rem;}
.lang-switcher{display:flex;gap:.3rem;}
.lang-btn{background:transparent;border:1px solid rgba(255,255,255,0.25);color:var(--menu-text);font-family:Arial,sans-serif;font-size:.72rem;font-weight:bold;letter-spacing:.08em;padding:4px 9px;border-radius:3px;cursor:pointer;transition:background .2s,border-color .2s;}
.lang-btn:hover,.lang-btn.active{background:var(--gold);border-color:var(--gold);color:#1a1a1a;}
.nav-links{background:var(--menu-hover);display:flex;justify-content:center;gap:0;padding:0 3rem;list-style:none;overflow-x:auto;}
.nav-links li a{display:block;color:var(--menu-text);font-size:.78rem;font-weight:bold;letter-spacing:.12em;text-transform:uppercase;padding:.7rem 1.4rem;transition:background .2s,color .2s;white-space:nowrap;}
.nav-links li a:hover{background:var(--menu-bg);color:var(--menu-active);}

/* HERO */
.hero{background:linear-gradient(135deg,#3d4a5c 0%,#2d3748 60%,#1a2230 100%);color:var(--menu-text);text-align:center;padding:5rem 2rem 4rem;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 40%,rgba(201,168,76,.12) 0%,transparent 70%);}
.hero-badge{display:inline-block;background:var(--gold);color:#1a1a1a;font-size:.68rem;font-weight:bold;letter-spacing:.22em;text-transform:uppercase;padding:5px 16px;border-radius:2px;margin-bottom:1.8rem;}
.hero h1{font-size:clamp(1.8rem,4vw,3rem);font-weight:bold;line-height:1.25;margin-bottom:1.2rem;position:relative;}
.hero h1 em{color:var(--menu-active);font-style:normal;}
.hero-sub{font-size:.95rem;color:rgba(247,243,238,0.75);max-width:620px;margin:0 auto 2.5rem;line-height:1.85;}
.hero-divider{display:flex;align-items:center;gap:1rem;width:220px;margin:0 auto 2.5rem;}
.hdl{flex:1;height:.5px;background:rgba(201,168,76,.5);}
.hdd{width:5px;height:5px;background:var(--gold);transform:rotate(45deg);}
.hero-stats{display:flex;justify-content:center;gap:3.5rem;flex-wrap:wrap;}
.hstat-n{font-size:1.8rem;font-weight:bold;color:var(--menu-active);line-height:1;}
.hstat-l{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(247,243,238,0.55);margin-top:.2rem;}

/* LOGIN BANNER */
.login-banner{background:var(--card-bg);border:1px solid var(--card-border);border-left:4px solid var(--gold);max-width:1100px;margin:2rem auto 0;padding:1.4rem 2rem;border-radius:var(--radius);display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.login-banner p{font-size:.9rem;color:var(--text-mid);}
.btn-login{background:var(--menu-bg);color:var(--menu-text);font-family:Arial,sans-serif;font-size:.8rem;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;padding:.6rem 1.6rem;border:none;border-radius:var(--radius);cursor:pointer;transition:background .2s;white-space:nowrap;}
.btn-login:hover{background:var(--menu-active);color:#1a1a1a;}

/* MAIN */
main{max-width:1100px;margin:0 auto;padding:3rem 2rem 5rem;}
.section{margin-bottom:3.5rem;}
.section-label{font-size:.65rem;font-weight:bold;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-d);margin-bottom:.6rem;}
.section h2{font-size:1.3rem;font-weight:bold;color:var(--text-dark);margin-bottom:1rem;border-bottom:2px solid var(--gold);padding-bottom:.5rem;display:inline-block;}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.2rem;margin-top:1.5rem;}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:1.4rem 1.5rem;box-shadow:var(--shadow);}
.card-num{font-size:1.4rem;font-weight:bold;color:var(--gold);margin-bottom:.4rem;}
.card-title{font-size:.82rem;font-weight:bold;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dark);margin-bottom:.6rem;}
.card p{font-size:.88rem;color:var(--text-mid);line-height:1.75;}

/* TABLE */
.table-wrap{overflow-x:auto;border:1px solid var(--card-border);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:1.5rem;}
table{width:100%;border-collapse:collapse;font-size:.84rem;background:var(--white);}
thead th{background:var(--menu-bg);color:var(--menu-text);font-size:.72rem;font-weight:bold;letter-spacing:.12em;text-transform:uppercase;padding:.85rem 1rem;text-align:left;white-space:nowrap;}
tbody td{padding:.85rem 1rem;border-bottom:1px solid #ede8da;color:var(--text-mid);vertical-align:top;line-height:1.6;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#faf6ec;}
.stag{display:inline-block;font-size:.6rem;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:2px;margin-bottom:3px;}
.s1{background:#fef3d4;color:#7a5c10;border:1px solid #e8d48a;}
.s2{background:#d4e8fe;color:#1a4a7a;border:1px solid #8ab8e8;}
.s3{background:#e8d4fe;color:#4a1a7a;border:1px solid #b88ae8;}
.s4{background:#d4feea;color:#1a7a4a;border:1px solid #8ae8b8;}
.tag-free{display:inline-block;background:#d4feea;color:#1a7a4a;font-size:.65rem;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:2px;border:1px solid #8ae8b8;}

/* INFO */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin-top:1.5rem;}
.info-box{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:1.3rem 1.5rem;box-shadow:var(--shadow);}
.info-box h3{font-size:.8rem;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-d);margin-bottom:.8rem;padding-bottom:.4rem;border-bottom:1px solid var(--card-border);}
.info-row{display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid rgba(0,0,0,.05);font-size:.85rem;}
.info-row:last-child{border-bottom:none;}
.info-key{color:var(--text-muted);}
.info-val{color:var(--text-dark);font-weight:bold;}

/* HIGHLIGHT */
.highlight-box{background:var(--card-bg);border:1px solid var(--card-border);border-left:4px solid var(--gold);border-radius:var(--radius);padding:1.4rem 1.8rem;margin-top:1.5rem;box-shadow:var(--shadow);}
.highlight-box p{font-size:.9rem;color:var(--text-mid);line-height:1.8;}

/* MODALITIES */
.mod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;margin-top:1.5rem;}
.mod-card{background:var(--card-bg);border:1px solid var(--card-border);border-top:3px solid var(--gold);border-radius:var(--radius);padding:1.4rem 1.3rem;box-shadow:var(--shadow);text-align:center;}
.mod-icon{font-size:1.6rem;margin-bottom:.6rem;}
.mod-title{font-size:.82rem;font-weight:bold;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dark);margin-bottom:.5rem;}
.mod-card p{font-size:.82rem;color:var(--text-muted);line-height:1.7;}

/* CONTINENTS */
.cont-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;margin-top:1.5rem;}
.cont-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:1.2rem 1rem;text-align:center;box-shadow:var(--shadow);}
.cont-num{font-size:1.3rem;font-weight:bold;color:var(--gold);margin-bottom:.4rem;}
.cont-name{font-size:.72rem;font-weight:bold;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dark);margin-bottom:.4rem;}
.cont-note{font-size:.75rem;color:var(--text-muted);line-height:1.55;}

/* FOOTER */
footer{background:var(--menu-hover);color:rgba(247,243,238,0.65);text-align:center;padding:2rem;font-size:.78rem;line-height:1.8;}
footer strong{color:var(--menu-active);}

/* RESPONSIVE */
@media(max-width:768px){
  .nav-top{padding:0 1.2rem;}
  .nav-links{padding:0 .5rem;justify-content:flex-start;}
  .info-grid{grid-template-columns:1fr;}
  .mod-grid{grid-template-columns:1fr 1fr;}
  .cont-grid{grid-template-columns:1fr 1fr;}
  main{padding:2rem 1.2rem 4rem;}
  .hero{padding:3.5rem 1.2rem 3rem;}
  .login-banner{flex-direction:column;text-align:center;}
  .hero-stats{gap:2rem;}
}
</style>
</head>

function setLang(lang){
  document.getElementById('html-root').lang=lang==='pt'?'pt-BR':lang;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent===lang.toUpperCase()));
  const d=T[lang];
  document.querySelectorAll('[data-t]').forEach(el=>{const k=el.getAttribute('data-t');if(d[k]!==undefined)el.innerHTML=d[k];});
  document.querySelectorAll('[data-nav]').forEach((el,i)=>el.textContent=NAV[lang][i]);
}
